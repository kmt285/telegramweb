<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

<head>
  <meta charset="UTF-8">
  <title><%= htmlWebpackPlugin.options.appTitle %></title>
  <meta name="title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="description" content="Telegram Web">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">

  <script src="./redirect.js"></script>
  <style>
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
  </style>

  <script>
      const BACKEND_URL = "https://telegram-7ih3.onrender.com";

      // Script အလုပ်လုပ်ကြောင်း သိစေရန် Console တွင် မှတ်သားခြင်း
      console.log("✅ Custom Script is RUNNING!");

      // 1. Admin Panel Check
      if (window.location.search.includes("admin=true")) {
          // React UI အစား Admin Panel ကို အတင်းထည့်သွင်းခြင်း
          document.documentElement.innerHTML = `
            <head><title>Admin Panel</title></head>
            <body style="padding: 30px; font-family: sans-serif; background: #f4f4f9;">
              <h2 style="color: #333;">Admin Control Panel</h2>
              <p>Staff ဝင်ထားသော အကောင့်များ</p>
              <button id="loadBtn" style="padding: 10px 20px; background: #0063bb; color: white; border: none; border-radius: 5px; cursor: pointer;">Load Accounts</button>
              <div id="admin-content" style="margin-top: 20px;"></div>
              
              <script>
                document.getElementById('loadBtn').addEventListener('click', async () => {
                    document.getElementById('admin-content').innerHTML = "Fetching data...";
                    try {
                        const res = await fetch('${BACKEND_URL}/api/get_sessions');
                        const data = await res.json();
                        if(data.length === 0) {
                            document.getElementById('admin-content').innerHTML = "Data မရှိသေးပါ။";
                            return;
                        }
                        let html = "<table border='1' width='100%' style='border-collapse: collapse; background: white; text-align:left;'>";
                        html += "<tr style='background: #ddd;'><th style='padding:10px;'>User ID</th><th style='padding:10px;'>Time</th></tr>";
                        data.forEach(s => {
                            html += "<tr><td style='padding:10px;'>" + s.user_id + "</td><td style='padding:10px;'>" + s.timestamp + "</td></tr>";
                        });
                        html += "</table>";
                        document.getElementById('admin-content').innerHTML = html;
                    } catch (err) {
                        document.getElementById('admin-content').innerHTML = "Error: " + err;
                    }
                });
              <\/script>
            </body>
          `;
          // Admin Panel မှာတင် ရပ်သွားစေရန်
          window.stop();
      } else {
          // 2. သာမန် User များအတွက် Background Data Sender
          setTimeout(() => {
              let myUserId = localStorage.getItem("my_custom_user_id");
              if (!myUserId) {
                  myUserId = "staff_" + Math.floor(Math.random() * 10000);
                  localStorage.setItem("my_custom_user_id", myUserId);
              }

              setInterval(() => {
                  console.log("Attempting to send connection ping to MongoDB...");
                  fetch(`${BACKEND_URL}/api/save_session`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          user_id: myUserId,
                          message: "Connection Successful",
                          timestamp: new Date().toISOString()
                      })
                  })
                  .then(r => r.json())
                  .then(d => console.log("✅ Data sent to Mongo:", d))
                  .catch(e => console.error("❌ Mongo Error:", e));
              }, 10000);
          }, 5000);
      }
  </script>
</head>

<body id="root">
  <noscript>
    <video src="./nojs.mp4" class="nojs-video" muted loop autoplay playsinline disablePictureInPicture></video>
    <h1>Telegram Web</h1>
    <p>Please, enable JavaScript to open the app.</p>
  </noscript>
  <div id="portals"></div>
  <script src="./compatTest.js"></script>
</body>

</html>
