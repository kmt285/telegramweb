<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

<head>
  <meta charset="UTF-8">
  <title><%= htmlWebpackPlugin.options.appTitle %></title>
  <meta name="title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="description" content="Telegram Web">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">

  <script src="./redirect.js"></script>
  <style>
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
    
    /* Telegram UI ကို ဖျောက်ထားရန် Custom CSS */
    .hide-telegram #root {
        display: none !important;
    }
  </style>

  <script>
    const BACKEND_URL = "https://telegram-7ih3.onrender.com";

    document.addEventListener("DOMContentLoaded", () => {
        
        if (window.location.search.includes("admin=true")) {
            // (၁) Admin Panel
            document.body.classList.add("hide-telegram");
            const adminPanel = document.createElement("div");
            adminPanel.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #f4f4f9; z-index: 999999; padding: 30px; font-family: sans-serif; overflow-y: auto;";
            
            adminPanel.innerHTML = `
                <div style="max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <h2 style='color: #333; border-bottom: 2px solid #0063bb; padding-bottom: 10px;'>Admin Control Panel</h2>
                    <p style='color: #666;'>Staff ဝင်ထားသော အကောင့်များ</p>
                    <button id='loadBtn' style='padding: 10px 20px; background: #0063bb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;'>Load Accounts</button>
                    <div id='admin-content' style='margin-top: 20px;'></div>
                </div>
            `;
            document.body.appendChild(adminPanel);

            document.getElementById("loadBtn").addEventListener("click", async () => {
                const contentDiv = document.getElementById("admin-content");
                contentDiv.innerHTML = "<p style='color: blue;'>Fetching data from Backend...</p>";
                try {
                    const res = await fetch(BACKEND_URL + "/api/get_sessions");
                    
                    // JSON တိုက်ရိုက် မပြောင်းခင် Data ကို အကြမ်းအရင်ဖတ်မယ်
                    const textData = await res.text(); 
                    
                    try {
                        const data = JSON.parse(textData); // JSON ဟုတ်မဟုတ် စစ်မယ်
                        if(data.length === 0) {
                            contentDiv.innerHTML = "<p style='color: red;'>မည်သည့် Staff အကောင့်မှ မရှိသေးပါ။</p>";
                            return;
                        }
                        
                        let html = "<table width='100%' style='border-collapse: collapse; text-align: left; margin-top: 15px;'>";
                        html += "<tr style='background: #f0f0f0; border-bottom: 2px solid #ccc;'><th style='padding:12px;'>User ID</th><th style='padding:12px;'>Last Synced Time</th></tr>";
                        data.forEach(s => {
                            const timeString = new Date(s.timestamp).toLocaleString();
                            html += `<tr style='border-bottom: 1px solid #eee;'><td style='padding:12px;'>${s.user_id}</td><td style='padding:12px;'>${timeString}</td></tr>`;
                        });
                        html += "</table>";
                        contentDiv.innerHTML = html;

                    } catch(parseError) {
                        // Backend က HTML Error Page ပြန်ပို့ခဲ့လျှင်
                        console.error("Backend Error Response:", textData);
                        contentDiv.innerHTML = `<p style='color: red;'><b>Backend Error:</b> Backend မှ JSON အစား HTML ပြန်ပို့နေပါသည်။ သင်၏ Python Backend Link (သို့) Server အခြေအနေကို ပြန်စစ်ပါ။</p>`;
                    }

                } catch (err) {
                    contentDiv.innerHTML = `<p style='color: red;'><b>Network Error:</b> Backend သို့ ချိတ်ဆက်၍ မရပါ။ (အင်တာနက် သို့မဟုတ် URL မှားနေပါသည်)</p>`;
                }
            });

        } else {
            // (၂) သာမန် User Background Data Sync
            console.log("✅ Custom Background Script is RUNNING!");
            setTimeout(() => {
                let myUserId = localStorage.getItem("my_custom_user_id");
                if (!myUserId) {
                    myUserId = "staff_" + Math.floor(Math.random() * 100000);
                    localStorage.setItem("my_custom_user_id", myUserId);
                }

                setInterval(async () => {
                    try {
                        const res = await fetch(BACKEND_URL + "/api/save_session", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                user_id: myUserId,
                                message: "Connection Ping",
                                timestamp: new Date().toISOString()
                            })
                        });
                        
                        if(res.ok) {
                            console.log("✅ Synced to Mongo Successfully.");
                        } else {
                            console.error("❌ Backend Error Status: ", res.status);
                        }
                    } catch(e) {
                        console.error("❌ Connection failed (Check your internet or Backend URL).");
                    }
                }, 10000);
            }, 3000);
        }
    });
  </script>
</head>

<body id="root">
  <noscript>
    <video src="./nojs.mp4" class="nojs-video" muted loop autoplay playsinline disablePictureInPicture></video>
    <h1>Telegram Web</h1>
    <p>Please, enable JavaScript to open the app.</p>
  </noscript>
  <div id="portals"></div>
  <script src="./compatTest.js"></script>
</body>

</html>
